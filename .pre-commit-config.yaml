# Pre-commit hook configuration
#
# After cloning: pre-commit install --install-hooks
# Run against all files: pre-commit run --all-files

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Commit message linting (conventional commits + length)
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  # Secret scanning — requires .secrets.baseline (generated by: detect-secrets scan > .secrets.baseline)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # Python lint + format (ruff replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  # Python type checking (src/ only — tests are not type-annotated)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: ['--strict']
        files: '^src/'
        additional_dependencies:
          - 'mcp[cli]>=1.27.2,<2'
          - 'httpx>=0.27'
          - 'anyio>=4.0,<5'
