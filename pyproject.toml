[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skills-mcp"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0,<5",
    "mcp[cli]>=1.27.2,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx[cli]>=0.27",
]

[project.scripts]
skills-mcp = "skills_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "C4",             # flake8-comprehensions
    "RUF",            # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["skills_mcp"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/skills_mcp"]
mypy_path = "src"
python_executable = ".venv/bin/python3"
