name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# workflow_run runs in the base-branch (main) context with a write-capable
# GITHUB_TOKEN; the job-level actor and conclusion checks are the trust guards.
permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Merge Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # Guard: CI must have succeeded for a Dependabot-authored branch.
    # The if-check is at the job level so the job is entirely skipped (not just
    # the steps) for non-Dependabot or failed workflow runs.
    if: >-
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Find and merge Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Look up the open PR for the branch Dependabot ran CI on.
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "$HEAD_BRANCH" \
            --author "dependabot[bot]" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open Dependabot PR for branch '$HEAD_BRANCH' — skipping."
            exit 0
          fi

          PR_TITLE=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json title \
            --jq '.title')

          echo "PR #$PR_NUMBER: $PR_TITLE"

          # Skip dependency-constraint range updates, e.g.:
          #   "Update mcp[cli] requirement from <2,>=1.27.2 to >=2.0.0,<3"
          # These change the accepted version bound and typically signal a major
          # API revision that warrants a manual review.
          if echo "$PR_TITLE" | grep -qi "requirement"; then
            echo "Constraint-range update detected — skipping (manual review recommended)."
            exit 0
          fi

          # Fail closed: merge only plain "Bump X from A.B[.C] to D.E" titles
          # whose leading (major) version component is unchanged. Grouped
          # updates and unparseable titles need manual review.
          OLD_MAJOR=$(echo "$PR_TITLE" | sed -nE 's/.* from ([0-9]+)\.[0-9].* to [0-9]+\.[0-9].*/\1/p')
          NEW_MAJOR=$(echo "$PR_TITLE" | sed -nE 's/.* from [0-9]+\.[0-9].* to ([0-9]+)\.[0-9].*/\1/p')

          if [ -z "$OLD_MAJOR" ] || [ -z "$NEW_MAJOR" ] || [ "$OLD_MAJOR" != "$NEW_MAJOR" ]; then
            echo "Major bump, grouped or unparseable title — skipping (manual review)."
            exit 0
          fi

          # Only act on the exact commit CI validated.
          PR_HEAD=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          if [ "$PR_HEAD" != "$HEAD_SHA" ]; then
            echo "PR head $PR_HEAD differs from validated commit $HEAD_SHA — skipping."
            exit 0
          fi

          # Approve the PR. The repo ruleset requires 1 approving review and
          # forbids the last-commit author from self-approving. github-actions[bot]
          # is a different identity from dependabot[bot], so this is allowed.
          # No CODEOWNERS file exists, so the code-owner requirement auto-passes.
          echo "Approving PR #$PR_NUMBER"
          gh pr review "$PR_NUMBER" --approve --repo "$REPO"

          # Squash-merge: the repo ruleset only permits squash merges.
          echo "Merging PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA" --repo "$REPO"
